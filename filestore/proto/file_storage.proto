syntax = "proto3";

package filestore;

option cc_generic_services = true;

message ResultCode
{
    int32 errcode = 1;
    bytes errmsg = 2;
}

// 文件块所在存储节点的位置
message ChunkLocation
{
    int32 chunk_index = 1;
    string ip = 2;
    int32 port = 3;
    string checksum = 4;   // 块 MD5 校验和（上传完成后登记，下载时比对）
    int64 offset = 5;      // 块在数据文件内的紧凑存储偏移（上传完成后登记）
    int32 size = 6;        // 块实际大小（字节）
}

// ===== 鉴权 =====

message RegisterRequest
{
    string username = 1;
    string password = 2;
}

message RegisterResponse
{
    ResultCode result = 1;
}

message LoginRequest
{
    string username = 1;
    string password = 2;
}

message LoginResponse
{
    ResultCode result = 1;
    string token = 2;      // 登录会话 token
    int32 user_id = 3;
}

message LogoutRequest
{
    string token = 1;
}

message LogoutResponse
{
    ResultCode result = 1;
}

// ===== 目录（虚拟文件树） =====

message MkdirRequest
{
    string token = 1;
    string path = 2;       // 要创建的目录虚拟路径
}

message MkdirResponse
{
    ResultCode result = 1;
}

message RmdirRequest
{
    string token = 1;
    string path = 2;
    bool recursive = 3;   // true=递归删除目录下所有子目录和文件
}

message RmdirResponse
{
    ResultCode result = 1;
}

// 目录项
message DirEntry
{
    string name = 1;       // 文件/目录名
    bool is_dir = 2;       // true=目录 false=文件
    int32 file_id = 3;     // 文件对应的 file_id（目录为 0）
}

message ListDirRequest
{
    string token = 1;
    string path = 2;       // 要列出的目录虚拟路径（/ 表示根）
}

message ListDirResponse
{
    ResultCode result = 1;
    repeated DirEntry entries = 2;
}

// ===== 文件（ID-first：路径 -> file_id） =====

message UploadFileRequest
{
    string token = 1;
    string path = 2;       // 文件虚拟路径（如 /docs/report.txt）
    int64 filesize = 3;
    int32 chunk_count = 4;
}

message UploadFileResponse
{
    ResultCode result = 1;
    int32 file_id = 2;                 // 本次上传分配的唯一标识（数据文件以 file_id 命名）
    repeated ChunkLocation chunks = 3; // 块分配方案
}

message QueryFileRequest
{
    string token = 1;
    string path = 2;       // 文件虚拟路径
}

message QueryFileResponse
{
    ResultCode result = 1;
    int32 file_id = 2;
    int64 filesize = 3;
    int32 chunk_count = 4;
    repeated ChunkLocation chunks = 5; // 块位置映射
}

// 删除文件（元数据服务与存储服务共用：按 file_id 定位；token 仅元数据服务校验）
message DeleteFileRequest
{
    string token = 1;
    int32 file_id = 2;
}

message DeleteFileResponse
{
    ResultCode result = 1;
}

// 上传完成确认：块全部落盘后，把文件状态从 PENDING 置为 COMPLETE，
// 并登记每块校验和（chunk_index + checksum）
message CommitUploadRequest
{
    string token = 1;
    int32 file_id = 2;
    repeated ChunkLocation chunks = 3;   // 每块的 chunk_index + checksum
}

message CommitUploadResponse
{
    ResultCode result = 1;
}

// 上传失败回滚：删除 PENDING 状态的元数据记录
message CancelUploadRequest
{
    string token = 1;
    int32 file_id = 2;
}

message CancelUploadResponse
{
    ResultCode result = 1;
}

// 存储节点（去重后的 ip/port）
message StorageNode
{
    string ip = 1;
    int32 port = 2;
}

// 查询某文件涉及的（去重后的）存储节点列表
message GetFileNodesRequest
{
    string token = 1;
    string path = 2;       // 文件虚拟路径
}

message GetFileNodesResponse
{
    ResultCode result = 1;
    int32 file_id = 2;                 // 唯一标识
    repeated StorageNode nodes = 3;    // 去重后的存储节点列表
}

// 待清理任务入队（删块失败后由客户端上报，元数据服务持久化 + 推 Redis Stream）
message AddCleanupTaskRequest
{
    string node_ip = 1;
    int32 node_port = 2;
    int32 file_id = 3;   // 待清理的数据文件唯一标识
}

message AddCleanupTaskResponse
{
    ResultCode result = 1;
}

service MetaServiceRpc
{
    // 鉴权
    rpc Register(RegisterRequest) returns(RegisterResponse);
    rpc Login(LoginRequest) returns(LoginResponse);
    rpc Logout(LogoutRequest) returns(LogoutResponse);

    // 目录
    rpc Mkdir(MkdirRequest) returns(MkdirResponse);
    rpc Rmdir(RmdirRequest) returns(RmdirResponse);
    rpc ListDir(ListDirRequest) returns(ListDirResponse);

    // 文件
    rpc UploadFile(UploadFileRequest) returns(UploadFileResponse);
    rpc CommitUpload(CommitUploadRequest) returns(CommitUploadResponse);
    rpc CancelUpload(CancelUploadRequest) returns(CancelUploadResponse);
    rpc QueryFile(QueryFileRequest) returns(QueryFileResponse);
    rpc DeleteFile(DeleteFileRequest) returns(DeleteFileResponse);
    rpc GetFileNodes(GetFileNodesRequest) returns(GetFileNodesResponse);
    rpc AddCleanupTask(AddCleanupTaskRequest) returns(AddCleanupTaskResponse);
}

// ===== 存储服务：文件块（数据文件以 file_id 命名） =====

message PutChunkRequest
{
    int32 file_id = 1;
    int32 chunk_index = 2;
    bytes data = 3;
}

message PutChunkResponse
{
    ResultCode result = 1;
    string checksum = 2;   // 存储端计算返回的块 MD5
    int64 offset = 3;      // 紧凑追加写后本块的偏移
    int32 size = 4;        // 本块实际大小
}

message GetChunkRequest
{
    int32 file_id = 1;
    int32 chunk_index = 2;   // 保留：日志/调试用
    int32 chunk_size = 3;    // 兼容旧字段
    int64 offset = 4;        // 块在数据文件内的偏移（紧凑存储）
    int32 size = 5;          // 块实际大小（按此长度读取）
}

message GetChunkResponse
{
    ResultCode result = 1;
    bytes data = 2;
}

// 批量上传：一次请求携带同一节点的多个块（减少往返）
message ChunkData
{
    int32 chunk_index = 1;
    bytes data = 2;
}

message ChunkResult
{
    int32 chunk_index = 1;
    int64 offset = 2;    // 紧凑追加写后本块偏移
    int32 size = 3;      // 本块实际大小
    string checksum = 4; // 本块 MD5
}

message PutChunksBatchRequest
{
    int32 file_id = 1;
    repeated ChunkData chunks = 2;
}

message PutChunksBatchResponse
{
    ResultCode result = 1;
    repeated ChunkResult chunks = 2;
}

// 批量下载：一次请求获取同一节点的多个块（按 offset/size 定位，减少往返）
message GetChunkSpec
{
    int32 chunk_index = 1;
    int64 offset = 2;    // 块在数据文件内的偏移（紧凑存储）
    int32 size = 3;      // 块实际大小（按此长度读取）
}

message GetChunksBatchRequest
{
    int32 file_id = 1;
    repeated GetChunkSpec chunks = 2;
}

message GetChunkData
{
    int32 chunk_index = 1;
    bytes data = 2;
}

message GetChunksBatchResponse
{
    ResultCode result = 1;
    repeated GetChunkData chunks = 2;
}

// 列出本节点 data_dir 下的文件唯一标识（P20 孤儿块 GC 用，按分片过滤）
message ListFilesRequest
{
    int32 shard = 1;        // 要扫描的分片号（0 ~ shard_count-1）
    int32 shard_count = 2;  // 总分片数 K
}

message ListFilesResponse
{
    ResultCode result = 1;
    repeated string filenames = 2;   // data_dir 下的 file_id（字符串形式）
}

service StorageServiceRpc
{
    rpc PutChunk(PutChunkRequest) returns(PutChunkResponse);
    rpc PutChunksBatch(PutChunksBatchRequest) returns(PutChunksBatchResponse);
    rpc GetChunk(GetChunkRequest) returns(GetChunkResponse);
    rpc GetChunksBatch(GetChunksBatchRequest) returns(GetChunksBatchResponse);
    rpc DeleteFile(DeleteFileRequest) returns(DeleteFileResponse);
    rpc ListFiles(ListFilesRequest) returns(ListFilesResponse);
}
