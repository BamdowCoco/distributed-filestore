syntax = "proto3";

package filestore;

option cc_generic_services = true;

message ResultCode
{
    int32 errcode = 1;
    bytes errmsg = 2;
}

// 文件块所在存储节点的位置
message ChunkLocation
{
    int32 chunk_index = 1;
    string ip = 2;
    int32 port = 3;
    string checksum = 4;   // 块 MD5 校验和（上传完成后登记，下载时比对）
    int64 offset = 5;      // 块在数据文件内的紧凑存储偏移（上传完成后登记）
    int32 size = 6;        // 块实际大小（字节）
}

// ===== 元数据服务：文件索引 =====

message UploadFileRequest
{
    string filename = 1;
    int64 filesize = 2;
    int32 chunk_count = 3;
}

message UploadFileResponse
{
    ResultCode result = 1;
    repeated ChunkLocation chunks = 2;   // 块分配方案
}

message QueryFileRequest
{
    string filename = 1;
}

message QueryFileResponse
{
    ResultCode result = 1;
    int64 filesize = 2;
    int32 chunk_count = 3;
    repeated ChunkLocation chunks = 4;   // 块位置映射
}

message DeleteFileRequest
{
    string filename = 1;
}

message DeleteFileResponse
{
    ResultCode result = 1;
}

// 上传完成确认：块全部落盘后，把文件状态从 PENDING 置为 COMPLETE，
// 并登记每块校验和（chunk_index + checksum）
message CommitUploadRequest
{
    string filename = 1;
    repeated ChunkLocation chunks = 2;   // 每块的 chunk_index + checksum
}

message CommitUploadResponse
{
    ResultCode result = 1;
}

// 上传失败回滚：删除 PENDING 状态的元数据记录
message CancelUploadRequest
{
    string filename = 1;
}

message CancelUploadResponse
{
    ResultCode result = 1;
}

// 存储节点（去重后的 ip/port）
message StorageNode
{
    string ip = 1;
    int32 port = 2;
}

// 查询某文件涉及的（去重后的）存储节点列表
message GetFileNodesRequest
{
    string filename = 1;
}

message GetFileNodesResponse
{
    ResultCode result = 1;
    repeated StorageNode nodes = 2;
}

service MetaServiceRpc
{
    rpc UploadFile(UploadFileRequest) returns(UploadFileResponse);
    rpc CommitUpload(CommitUploadRequest) returns(CommitUploadResponse);
    rpc CancelUpload(CancelUploadRequest) returns(CancelUploadResponse);
    rpc QueryFile(QueryFileRequest) returns(QueryFileResponse);
    rpc DeleteFile(DeleteFileRequest) returns(DeleteFileResponse);
    rpc GetFileNodes(GetFileNodesRequest) returns(GetFileNodesResponse);
}

// ===== 存储服务：文件块 =====

message PutChunkRequest
{
    string filename = 1;
    int32 chunk_index = 2;
    bytes data = 3;
}

message PutChunkResponse
{
    ResultCode result = 1;
    string checksum = 2;   // 存储端计算返回的块 MD5
    int64 offset = 3;      // 紧凑追加写后本块的偏移
    int32 size = 4;        // 本块实际大小
}

message GetChunkRequest
{
    string filename = 1;
    int32 chunk_index = 2;   // 保留：日志/调试用
    int32 chunk_size = 3;    // 兼容旧字段
    int64 offset = 4;        // 块在数据文件内的偏移（紧凑存储）
    int32 size = 5;          // 块实际大小（按此长度读取）
}

message GetChunkResponse
{
    ResultCode result = 1;
    bytes data = 2;
}

// 批量上传：一次请求携带同一节点的多个块（减少往返）
message ChunkData
{
    int32 chunk_index = 1;
    bytes data = 2;
}

message ChunkResult
{
    int32 chunk_index = 1;
    int64 offset = 2;    // 紧凑追加写后本块偏移
    int32 size = 3;      // 本块实际大小
    string checksum = 4; // 本块 MD5
}

message PutChunksBatchRequest
{
    string filename = 1;
    repeated ChunkData chunks = 2;
}

message PutChunksBatchResponse
{
    ResultCode result = 1;
    repeated ChunkResult chunks = 2;
}

// 批量下载：一次请求获取同一节点的多个块（按 offset/size 定位，减少往返）
message GetChunkSpec
{
    int32 chunk_index = 1;
    int64 offset = 2;    // 块在数据文件内的偏移（紧凑存储）
    int32 size = 3;      // 块实际大小（按此长度读取）
}

message GetChunksBatchRequest
{
    string filename = 1;
    repeated GetChunkSpec chunks = 2;
}

message GetChunkData
{
    int32 chunk_index = 1;
    bytes data = 2;
}

message GetChunksBatchResponse
{
    ResultCode result = 1;
    repeated GetChunkData chunks = 2;
}

// 列出本节点 data_dir 下的所有文件名（P20 孤儿块 GC 用）
message ListFilesRequest
{
}

message ListFilesResponse
{
    ResultCode result = 1;
    repeated string filenames = 2;
}

service StorageServiceRpc
{
    rpc PutChunk(PutChunkRequest) returns(PutChunkResponse);
    rpc PutChunksBatch(PutChunksBatchRequest) returns(PutChunksBatchResponse);
    rpc GetChunk(GetChunkRequest) returns(GetChunkResponse);
    rpc GetChunksBatch(GetChunksBatchRequest) returns(GetChunksBatchResponse);
    rpc DeleteFile(DeleteFileRequest) returns(DeleteFileResponse);
    rpc ListFiles(ListFilesRequest) returns(ListFilesResponse);
}
