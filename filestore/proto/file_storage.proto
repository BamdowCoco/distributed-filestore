syntax = "proto3";

package filestore;

option cc_generic_services = true;

message ResultCode
{
    int32 errcode = 1;
    bytes errmsg = 2;
}

// 文件块所在存储节点的位置
message ChunkLocation
{
    int32 chunk_index = 1;
    string ip = 2;
    int32 port = 3;
    string checksum = 4;   // 块 MD5 校验和（上传完成后登记，下载时比对）
}

// ===== 元数据服务：文件索引 =====

message UploadFileRequest
{
    string filename = 1;
    int64 filesize = 2;
    int32 chunk_count = 3;
}

message UploadFileResponse
{
    ResultCode result = 1;
    repeated ChunkLocation chunks = 2;   // 块分配方案
}

message QueryFileRequest
{
    string filename = 1;
}

message QueryFileResponse
{
    ResultCode result = 1;
    int64 filesize = 2;
    int32 chunk_count = 3;
    repeated ChunkLocation chunks = 4;   // 块位置映射
}

message DeleteFileRequest
{
    string filename = 1;
}

message DeleteFileResponse
{
    ResultCode result = 1;
}

// 上传完成确认：块全部落盘后，把文件状态从 PENDING 置为 COMPLETE，
// 并登记每块校验和（chunk_index + checksum）
message CommitUploadRequest
{
    string filename = 1;
    repeated ChunkLocation chunks = 2;   // 每块的 chunk_index + checksum
}

message CommitUploadResponse
{
    ResultCode result = 1;
}

// 上传失败回滚：删除 PENDING 状态的元数据记录
message CancelUploadRequest
{
    string filename = 1;
}

message CancelUploadResponse
{
    ResultCode result = 1;
}

service MetaServiceRpc
{
    rpc UploadFile(UploadFileRequest) returns(UploadFileResponse);
    rpc CommitUpload(CommitUploadRequest) returns(CommitUploadResponse);
    rpc CancelUpload(CancelUploadRequest) returns(CancelUploadResponse);
    rpc QueryFile(QueryFileRequest) returns(QueryFileResponse);
    rpc DeleteFile(DeleteFileRequest) returns(DeleteFileResponse);
}

// ===== 存储服务：文件块 =====

message PutChunkRequest
{
    string filename = 1;
    int32 chunk_index = 2;
    bytes data = 3;
}

message PutChunkResponse
{
    ResultCode result = 1;
    string checksum = 2;   // 存储端计算返回的块 MD5
}

message GetChunkRequest
{
    string filename = 1;
    int32 chunk_index = 2;
    int32 chunk_size = 3;
}

message GetChunkResponse
{
    ResultCode result = 1;
    bytes data = 2;
}

service StorageServiceRpc
{
    rpc PutChunk(PutChunkRequest) returns(PutChunkResponse);
    rpc GetChunk(GetChunkRequest) returns(GetChunkResponse);
    rpc DeleteFile(DeleteFileRequest) returns(DeleteFileResponse);
}
